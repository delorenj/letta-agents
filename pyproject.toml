[project]
name = "delonet-letta"
version = "0.1.0"
description = "The control center for the DeLoNET Letta AgentForge"
readme = "README.md"
authors = [
    { name = "Jarad DeLorenzo", email = "jaradd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "letta-client>=0.1.319",
    "openrouter>=1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1",
]

[project.scripts]
delonet-letta = "delonet_letta:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
